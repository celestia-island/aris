[package]
name = "aris-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
description = "WASM Component Model host for aris — runs tairitsu/hikari components via Wasmtime"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
aris-render = { path = "../render" }
# tairitsu-ssr provides render_to_html(): a synchronous, non-tokio host that
# loads a WASM Component (wasm32-wasip2), instantiates it with the
# tairitsu-browser:full WIT world, calls lifecycle::start, and returns the
# rendered body HTML string. Published on crates.io since the 0.5 family line
# (registry-first per workspace law); for local tairitsu development, override
# in ~/.cargo/config.toml:
#   [patch.crates-io]
#   tairitsu-ssr = { path = "<celestia>/tairitsu/packages/ssr" }
tairitsu-ssr = "0.5"
