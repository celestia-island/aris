name: CI
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: [self-hosted, linux, x64, local]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # yeslogic-fontconfig-sys (via aris-render) needs the system fontconfig
      # dev headers and pkg-config to build on the Ubuntu runner.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev pkg-config
      - run: cargo check --workspace

  clippy:
    runs-on: [self-hosted, linux, x64, local]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev pkg-config
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    runs-on: [self-hosted, linux, x64, local]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    runs-on: [self-hosted, linux, x64, local]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev pkg-config
      - run: cargo test --workspace
