name: CI
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # yeslogic-fontconfig-sys (via aris-render) needs the system fontconfig
      # dev headers and pkg-config to build on the Ubuntu runner.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev pkg-config
      - run: cargo check --workspace --locked
      # kei's build channel cross-compiles kei_tty with only the `png`
      # feature (`required-features` keeps this bin invisible to
      # `cargo check --workspace`), so pin its lane explicitly — a
      # transitive bump that breaks the png closure must fail here, not at
      # kei's next firmware build.
      - run: cargo check --locked -p aris-render --no-default-features --features png --bin kei_tty

  clippy:
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev pkg-config
      - run: cargo clippy --workspace --locked -- -D warnings

  fmt:
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev pkg-config
      - run: cargo test --workspace --locked
      # The js/winit feature lane compiles the bridge unit tests (keyboard
      # mapping, id-domain round-trips) that the default feature set gates off.
      - run: cargo test --locked -p aris-render --features "winit js"
